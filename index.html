<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>XIMERMJ Archive</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
cursor:crosshair;
}

body{
background:#050505;
color:#ddd;
font-family:'IBM Plex Mono', monospace;
overflow:hidden;
height:100vh;
}

body::before{
content:"";
position:fixed;
inset:0;
background:url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80");
background-size:cover;
background-position:center;
opacity:.15;
filter:blur(2px);
z-index:-3;
}

body::after{
content:"";
position:fixed;
inset:0;
background:
repeating-linear-gradient(
0deg,
transparent,
transparent 2px,
rgba(255,255,255,.03) 3px
);
pointer-events:none;
z-index:999;
}

.window{
position:absolute;
background:rgba(8,8,8,.92);
border:1px solid rgba(255,255,255,.1);
backdrop-filter:blur(10px);
padding:15px;
box-shadow:
0 0 25px rgba(255,255,255,.04);
}

.header{
font-size:11px;
opacity:.5;
margin-bottom:12px;
letter-spacing:1px;
}

.time{
top:40px;
left:40px;
width:180px;
}

.album{
top:140px;
left:80px;
width:300px;
}

.album img{
width:100%;
display:block;
filter:contrast(1.1);
}

.player{
right:100px;
top:80px;
width:340px;
}

.progress{
margin-top:15px;
height:1px;
background:#444;
}

.progress::after{
content:"";
display:block;
width:63%;
height:100%;
background:#fff;
}

.away{
bottom:100px;
left:120px;
width:240px;
}

.archive{
bottom:60px;
right:80px;
width:300px;
}

.glitch{
animation:flicker 8s infinite;
}

@keyframes flicker{
0%,100%{opacity:1;}
50%{opacity:.92;}
51%{opacity:.75;}
52%{opacity:1;}
}
</style>
</head>

<body>

<div class="window time glitch">
<div class="header">SYSTEM</div>
11:27 PM<br>
BUFFALO, NY
</div>

<div class="window album">
<div class="header">IMG_4821.JPG</div>

<img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=900&q=80">

<br>

last modified:
03.18.2011
</div>

<div class="window player">
<div class="header">NOW PLAYING</div>

XIMERMJ<br>
HEADWAY

<div class="progress"></div>

<br>

03:21 / 04:48
</div>

<div class="window away">
<div class="header">STATUS</div>

listening to:<br>
sleepover (opb. dreamfone)
</div>

<div class="window archive">
<div class="header">ARCHIVE</div>

IMG_3818.JPG<br>
EXIT_23.PNG<br>
PLAYLIST_11PM.M3U<br>
UNTITLED.TXT<br>
VOICEMAIL_07.MP3
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Richner Records — Scheduled Maintenance</title>

  <meta
    name="description"
    content="Richner Records is currently undergoing scheduled maintenance."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #050505;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .maintenance {
      width: 100%;
      max-width: 850px;
      text-align: center;
    }

    .label {
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #777;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 100px);
      line-height: 0.9;
      letter-spacing: -0.06em;
      text-transform: uppercase;
    }

    .status {
      margin: 35px auto 0;
      max-width: 600px;
      font-family: "Courier New", monospace;
      font-size: 14px;
      line-height: 1.8;
      color: #aaa;
    }

    .line {
      width: 60px;
      height: 1px;
      background: #555;
      margin: 40px auto;
    }

    .footer {
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #555;
    }

    .blink {
      display: inline-block;
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <main class="maintenance">

    <div class="label">Richner Records</div>

    <h1>
      Scheduled<br>
      Maintenance.
    </h1>

    <div class="line"></div>

    <div class="status">
      Richner Records is currently undergoing scheduled maintenance.<br>
      The site will return shortly.<span class="blink">_</span>
    </div>

    <div class="line"></div>

    <div class="footer">
      Music · Art · Allegations.
    </div>

  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XIMERMJ Music</title>

<style>

body{
    background:#e5e5e5;
    font-family:Verdana, Arial, sans-serif;
    margin:0;
    font-size:11px;
}

.myspace{
    width:900px;
    margin:20px auto;
    background:white;
    border:1px solid #000;
}

header{
    background:#003399;
    color:white;
    padding:8px;
}

header h1{
    margin:0;
    font-size:24px;
}

nav{
    background:#3366cc;
    padding:6px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-right:15px;
    font-weight:bold;
}

.layout{
    display:grid;
    grid-template-columns:250px 1fr;
    gap:10px;
    padding:10px;
}

.box{
    border:1px solid #6699cc;
    margin-bottom:10px;
}

.box h3{
    background:#6699cc;
    color:white;
    margin:0;
    padding:5px;
    font-size:12px;
}

.box p{
    padding:5px;
    margin:0;
}

.profile-pic{
    width:100%;
    display:block;
}

.hero{
    background:#1d2f7a;
    height:250px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#ffb340;
    font-size:72px;
    font-weight:bold;
    text-transform:uppercase;
    border:1px solid #000;
}

.blog{
    border:1px solid #f5a35c;
    margin-top:10px;
}

.blog h3{
    background:#f5a35c;
    margin:0;
    padding:5px;
}

.blog p{
    padding:10px;
}

.friends{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.friend{
    height:80px;
    background:#dcdcdc;
    border:1px solid #999;
}

.footer{
    background:#003399;
    color:white;
    text-align:center;
    padding:8px;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="myspace">

<header>
    <h1>XIMERMJ MUSIC</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Music</a>
    <a href="#">Photos</a>
    <a href="#">Videos</a>
</nav>

<div class="layout">

<aside>

<div class="box">
    <h3>Artist Profile</h3>
    <img src="profile.jpg" class="profile-pic">
    <p>Electronic Artist</p>
</div>

<div class="box">
    <h3>Stats</h3>
    <p>Followers: 163</p>
    <p>Monthly Listeners: 1.2K</p>
    <p>Popularity: 14/100</p>
</div>

</aside>

<main>

<div class="hero">
    HEADWAY
</div>

<div class="blog">
    <h3>Latest Update</h3>
    <p>
        Frequencies continues to grow.
        Thanks for listening and supporting independent music.
    </p>
</div>

<div class="friends">
    <div class="friend"></div>
    <div class="friend"></div>
    <div class="friend"></div>
    <div class="friend"></div>
</div>

</main>

</div>

<div class="footer">
    © XIMERMJ
</div>
<iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/1stPbdCgVkg3albHc70EUb?utm_source=generator&theme=0&si=6d56f1e9b4d245c4" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
</div>

</body>
</html>

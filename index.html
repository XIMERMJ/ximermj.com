<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>XIMERMJ — AFTERBURN</title>
  <meta
    name="description"
    content="XIMERMJ — AFTERBURN. Listen now on Apple Music and Spotify."
  />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #080808;
      color: #f5f5f5;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* BACKGROUND */

    .background {
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(255,255,255,0.07),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          #111 0%,
          #080808 48%,
          #050505 100%
        );
    }

    .grain {
      position: fixed;
      inset: -50%;
      z-index: -1;
      pointer-events: none;
      opacity: 0.055;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
      animation: grain 0.25s steps(2) infinite;
    }

    @keyframes grain {
      0% { transform: translate(0,0); }
      25% { transform: translate(2%, -1%); }
      50% { transform: translate(-1%, 2%); }
      75% { transform: translate(1%, 1%); }
      100% { transform: translate(0,0); }
    }

    /* NAV */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 28px 42px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      mix-blend-mode: difference;
    }

    .logo {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    .nav-link {
      color: white;
      text-decoration: none;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      opacity: 0.8;
    }

    /* HERO */

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 80px;
    }

    .hero {
      width: min(1100px, 100%);
      text-align: center;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.48);
      margin-bottom: 28px;
    }

    .title {
      font-size: clamp(70px, 15vw, 190px);
      line-height: 0.78;
      font-weight: 900;
      letter-spacing: -0.075em;
      margin-left: -0.06em;
      background: linear-gradient(
        180deg,
        #ffffff 0%,
        #d7d7d7 42%,
        #555 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-transform: uppercase;
    }

    .artist {
      margin-top: 32px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.62);
    }

    /* RELEASE CARD */

    .release {
      margin: 64px auto 0;
      width: min(620px, 100%);
      padding: 22px;
      border: 1px solid rgba(255,255,255,0.11);
      background: rgba(255,255,255,0.035);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .release-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      text-align: left;
    }

    .release-info {
      min-width: 0;
    }

    .release-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .release-meta {
      margin-top: 7px;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.42);
    }

    /* BUTTONS */

    .buttons {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .stream-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 19px;
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      transition:
        background 0.25s ease,
        color 0.25s ease,
        transform 0.25s ease,
        border-color 0.25s ease;
    }

    .stream-button:hover {
      background: white;
      color: black;
      border-color: white;
      transform: translateY(-2px);
    }

    /* FOOTER */

    footer {
      position: fixed;
      bottom: 28px;
      left: 42px;
      right: 42px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(255,255,255,0.3);
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 12px rgba(255,255,255,0.8);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: .3; }
      50% { opacity: 1; }
    }

    /* MOBILE */

    @media (max-width: 650px) {

      nav {
        padding: 22px 20px;
      }

      .nav-link {
        display: none;
      }

      main {
        padding: 100px 18px 80px;
      }

      .title {
        font-size: clamp(64px, 20vw, 115px);
      }

      .artist {
        margin-top: 25px;
        font-size: 9px;
        letter-spacing: 0.3em;
      }

      .release {
        margin-top: 48px;
        padding: 18px;
      }

      .release-inner {
        flex-direction: column;
        align-items: stretch;
      }

      .buttons {
        width: 100%;
      }

      .stream-button {
        flex: 1;
      }

      footer {
        left: 20px;
        right: 20px;
        bottom: 18px;
      }

      .footer-right {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>
  <div class="grain"></div>

  <nav>
    <div class="logo">XIMERMJ</div>

    <a
      class="nav-link"
      href="#listen"
    >
      Listen
    </a>
  </nav>

  <main>

    <section class="hero">

      <div class="eyebrow">
        New Single · 2026
      </div>

      <h1 class="title">
        Afterburn
      </h1>

      <div class="artist">
        XIMERMJ
      </div>

      <div class="release" id="listen">

        <div class="release-inner">

          <div class="release-info">
            <div class="release-name">
              AFTERBURN
            </div>

            <div class="release-meta">
              Available everywhere
            </div>
          </div>

          <div class="buttons">

            <a
              class="stream-button"
              href="https://music.apple.com/us/album/afterburn/6820104032?i=6820104033"
              target="_blank"
              rel="noopener noreferrer"
            >
              Apple Music
            </a>

            <a
              class="stream-button"
              href="https://open.spotify.com/album/21fy9mn5l2QJheaA7tO4FI?si=xiKAbXi4TKaDa5uJ18mhKw"
              target="_blank"
              rel="noopener noreferrer"
            >
              Spotify
            </a>

          </div>

        </div>

      </div>

    </section>

  </main>

  <footer>

    <div class="status">
      <span class="dot"></span>
      XIMERMJ
    </div>

    <div class="footer-right">
      Richner Records LLC · 2026
    </div>

  </footer>

</body>
</html>

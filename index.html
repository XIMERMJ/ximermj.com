<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XIMERMJ | Independent Artist</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 80px 20px 40px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    h1 {
      font-size: 4rem;
      margin: 0;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .tagline {
      margin-top: 15px;
      font-size: 1.1rem;
      color: rgba(255,255,255,0.75);
    }

    section {
      padding: 60px 20px;
      max-width: 1000px;
      margin: auto;
    }

    .photos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .photos img {
      width: 100%;
      display: block;
      object-fit: cover;
      height: 320px;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .socials a {
      color: white;
      margin-right: 16px;
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.4);
    }

    .teaser {
      font-size: 1.4rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <header>
    <h1>XIMERMJ</h1>
    <p class="tagline">Independent artist. Self-owned. Built through Richner Records LLC.</p>
  </header>

  <section>
    <h2>About</h2>
    <p>
      I’m building on my own terms — creating independently, owning the work,
      and moving through my LLC with full creative control.
    </p>
  </section>


  <section>
    <h2>Teaser</h2>
    <p class="teaser">New work coming soon.</p>
  </section>

  <section class="socials">
    <h2>Links</h2>
    <a href="www.instagram.com/ximermj">Instagram</a>
    <a href="https://open.spotify.com/artist/3HF0pRkcW2264iFUOstWv4">Spotify</a>
    <a href="www.soundcloud.com/ximermj">Soundcloud</a>
  </section>
</body>
</html>

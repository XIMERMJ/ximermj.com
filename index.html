<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XIMERMJ</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
}

/* Background Image */

.hero{
    height:100vh;
    background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.75)),
    url("joshua-tree.jpg");
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
}

.hero-content{
    max-width:700px;
    margin-left:8%;
}

.hero h1{
    font-size:7rem;
    letter-spacing:.15em;
    font-weight:900;
}

.hero p{
    margin-top:20px;
    line-height:1.8;
    letter-spacing:.25em;
    text-transform:uppercase;
}

/* Buttons */

.buttons{
    margin-top:40px;
}

.btn{
    display:inline-block;
    padding:16px 40px;
    margin-right:15px;
    border:1px solid white;
    color:white;
    text-decoration:none;
    letter-spacing:.2em;
    transition:.3s;
}

.btn:hover{
    background:white;
    color:black;
}

/* Navigation */

nav{
    position:fixed;
    width:100%;
    top:0;
    left:0;
    padding:30px 60px;
    z-index:100;
    display:flex;
    justify-content:space-between;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:30px;
    letter-spacing:.15em;
}

/* Spotify */

.music{
    padding:100px 8%;
}

.music h2{
    margin-bottom:40px;
    letter-spacing:.2em;
    text-transform:uppercase;
}

.spotify{
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 40px rgba(255,255,255,.08);
}

/* Connect */

.connect{
    padding:80px 8%;
    border-top:1px solid rgba(255,255,255,.15);
}

.connect a{
    color:white;
    text-decoration:none;
    margin-right:30px;
    font-size:1.1rem;
    letter-spacing:.1em;
}

/* Footer */

footer{
    text-align:center;
    padding:50px;
    border-top:1px solid rgba(255,255,255,.1);
    color:#888;
}

/* Subtle film grain */

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.05;
    background-image:
    repeating-radial-gradient(circle at 0 0,
    rgba(255,255,255,.3),
    transparent 2px);
}

</style>
</head>

<body>

<nav>
    <div>XIMERMJ</div>

    <div>
        <a href="#music">MUSIC</a>
        <a href="#connect">CONTACT</a>
    </div>
</nav>

<section class="hero">

<div class="hero-content">

<h1>XIMERMJ</h1>

<p>
Electronic Artist<br>
Producer<br>
Visual Storyteller
</p>

<div class="buttons">
<a href="#music" class="btn">LISTEN</a>
<a href="#connect" class="btn">CONTACT</a>
</div>

</div>

</section>

<section id="music" class="music">

<h2>Featured Release</h2>

<div class="spotify">

<iframe
style="border-radius:12px"
src="https://open.spotify.com/embed/artist/YOUR_SPOTIFY_ID"
width="100%"
height="352"
frameborder="0"
allowfullscreen=""
allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
</iframe>

</div>

</section>

<section id="connect" class="connect">

<a href="https://instagram.com/yourname">Instagram</a>

<a href="https://soundcloud.com/yourname">SoundCloud</a>

<a href="https://github.com/yourname">GitHub</a>

<a href="mailto:you@email.com">Email</a>

</section>

<footer>
© 2026 XIMERMJ / Richner Records LLC
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The official website of independent electronic artist XIMERMJ.">
  <title>XIMERMJ — Official Site</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #030506; color: #f3f3f4; font-family: Arial, Helvetica, sans-serif; }
    a { color: inherit; text-decoration: none; }
    main { position: relative; min-height: 100svh; overflow: hidden; background: radial-gradient(circle at 72% 52%, #13214d 0, #070b18 25%, #030506 60%); }
    main::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .17; background: repeating-linear-gradient(0deg, transparent 0, transparent 3px, #fff 4px), radial-gradient(circle, #fff 0 .5px, transparent .7px); background-size: auto, 6px 6px; mix-blend-mode: soft-light; }
    .topbar { position: relative; z-index: 5; width: min(1380px, calc(100% - 64px)); margin: auto; padding: 25px 0; display: flex; align-items: center; justify-content: space-between; font-size: 11px; }
    .brand { font-weight: 850; font-size: 20px; letter-spacing: -.05em; }
    .navlinks { display: flex; gap: 40px; color: #b8b9bd; }
    .navlinks a { transition: .2s; }
    .navlinks a:hover { color: white; }
    .hero { position: relative; z-index: 3; width: min(1380px, calc(100% - 64px)); margin: auto; padding-top: 15vh; }
    .label { margin: 0 0 24px; text-transform: uppercase; font-size: 9px; letter-spacing: .2em; color: #8c91a2; }
    .hero h1 { margin: 0; max-width: 780px; font-size: clamp(4rem, 7.3vw, 8rem); line-height: .86; letter-spacing: -.07em; font-weight: 650; }
    .intro { max-width: 500px; margin: 34px 0 42px; color: #b5b7bf; font-size: 17px; line-height: 1.45; }
    .listen { display: flex; align-items: center; justify-content: space-between; width: 250px; padding: 15px 22px; border-radius: 100px; background: #f2f2f2; color: #171719; text-transform: uppercase; font-size: 10px; font-weight: 700; letter-spacing: .06em; box-shadow: 0 0 12px #fff, 0 0 28px #ff754f, 0 0 50px #ff754f55; transition: .25s; }
    .listen:hover { transform: translateX(5px); box-shadow: 0 0 16px #fff, 0 0 38px #ff754f; }
    .listen span { font-size: 17px; }
    .light { position: absolute; z-index: 1; top: -10%; left: 64%; height: 108%; width: 5px; background: #fff; box-shadow: 0 0 7px #fff, 0 0 20px #87a8ff, 0 0 55px #426fff, 0 0 130px #335cff, 0 0 260px #315cff; transform: rotate(.5deg); }
    .light::before, .light::after { content: ""; position: absolute; bottom: -2%; width: 47vw; height: 32%; border-bottom: 7px solid #fff; filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 22px #5f7fff) drop-shadow(0 0 55px #214fff); }
    .light::before { right: 0; border-right: 7px solid #fff; border-bottom-right-radius: 130px; }
    .light::after { left: 0; border-left: 7px solid #fff; border-bottom-left-radius: 130px; }
    .light span { position: absolute; top: 5%; left: 50%; width: 40vw; height: 80%; transform: translateX(-50%); background: #4f6fff22; filter: blur(45px); }
    .release { position: absolute; z-index: 4; bottom: -75px; left: 50%; transform: translateX(-50%); width: min(900px, 70vw); height: 155px; border: 1px solid #ffffff36; border-radius: 14px 14px 0 0; background: #0b0d12cc; backdrop-filter: blur(18px); box-shadow: 0 0 12px #fff6, 0 0 38px #5479ff88; display: flex; justify-content: space-between; padding: 27px 32px; }
    .release div { display: flex; flex-direction: column; gap: 10px; }
    .release span { color: #747986; text-transform: uppercase; font-size: 8px; letter-spacing: .16em; }
    .release strong { font-size: 18px; }
    .year { font-size: 10px !important; }
    @media (max-width: 700px) {
      .topbar { width: calc(100% - 40px); }
      .navlinks { gap: 18px; }
      .navlinks a:nth-child(2) { display: none; }
      .hero { width: calc(100% - 40px); padding-top: 17vh; }
      .hero h1 { font-size: 16vw; }
      .intro { font-size: 14px; width: 80%; }
      .light { left: 86%; opacity: .8; }
      .release { width: 88vw; bottom: -85px; }
      .listen { width: 220px; }
    }
    @media (prefers-reduced-motion: reduce) { .listen { transition: none; } }
  </style>
</head>
<body>
  <main>
    <nav class="topbar" aria-label="Primary navigation">
      <a class="brand" href="#">XIMERMJ</a>
      <div class="navlinks">
        <a href="https://open.spotify.com/search/XIMERMJ" target="_blank" rel="noreferrer">Music</a>
        <a href="https://www.instagram.com/ximermj/" target="_blank" rel="noreferrer">Instagram</a>
        <a href="mailto:jmr7100@icloud.com">Contact</a>
      </div>
    </nav>
    <div class="light" aria-hidden="true"><span></span></div>
    <section class="hero">
      <p class="label">Independent electronic artist · NY</p>
      <h1>Sound outside<br>the usual structure.</h1>
      <p class="intro">XIMERMJ creates instrumental electronic music shaped by atmosphere, texture and fractured rhythm.</p>
      <a class="listen" href="https://music.apple.com/us/search?term=XIMERMJ" target="_blank" rel="noreferrer">Listen now <span>→</span></a>
    </section>
    <aside class="release">
      <div><span>Latest release</span><strong>Signature Search</strong></div>
      <span class="year">2026</span>
    </aside>
  </main>
</body>
</html>

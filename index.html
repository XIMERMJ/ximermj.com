<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Richner Records — Under Maintenance</title>

  <meta
    name="description"
    content="Richner Records is currently under scheduled maintenance."
  >

  <style>
    :root {
      --black: #050505;
      --dark: #0b0b0b;
      --grey: #777;
      --light-grey: #b5b5b5;
      --white: #f2f2f2;
      --line: #292929;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    /* subtle screen texture */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;

      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.018) 0px,
          rgba(255,255,255,0.018) 1px,
          transparent 1px,
          transparent 4px
        );

      opacity: .7;
    }

    /* moving glitch sweep */
    body::after {
      content: "";
      position: fixed;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(255,255,255,.15);
      z-index: 25;
      pointer-events: none;

      animation: scan 7s linear infinite;
    }

    @keyframes scan {
      0% {
        top: -5%;
        opacity: 0;
      }

      10% {
        opacity: .5;
      }

      90% {
        opacity: .15;
      }

      100% {
        top: 105%;
        opacity: 0;
      }
    }

    .page {
      min-height: 100vh;
      padding: 38px 45px 32px;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 5;
    }

    /* HEADER */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .status {
      color: var(--grey);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--white);
      border-radius: 50%;
      animation: blink 1.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: .15; }
    }

    /* MAIN */

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1250px;
    }

    .code {
      color: var(--grey);
      font-size: 10px;
      letter-spacing: 3px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .glitch {
      position: relative;
      display: inline-block;

      font-size: clamp(58px, 10vw, 145px);
      line-height: .83;
      letter-spacing: -7px;
      font-weight: 600;
      text-transform: uppercase;

      color: var(--white);
    }

    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .glitch::before {
      color: #aaa;
      opacity: .45;

      clip-path: inset(20% 0 63% 0);

      transform: translate(-4px, 0);

      animation: glitch-one 4.2s infinite steps(1);
    }

    .glitch::after {
      color: #555;
      opacity: .55;

      clip-path: inset(65% 0 15% 0);

      transform: translate(4px, 0);

      animation: glitch-two 3.4s infinite steps(1);
    }

    @keyframes glitch-one {
      0%, 88%, 100% {
        transform: translate(0);
        opacity: 0;
      }

      89% {
        transform: translate(-7px, 1px);
        opacity: .6;
      }

      91% {
        transform: translate(5px, -1px);
      }

      93% {
        transform: translate(-2px, 0);
      }

      95% {
        opacity: 0;
      }
    }

    @keyframes glitch-two {
      0%, 78%, 100% {
        transform: translate(0);
        opacity: 0;
      }

      79% {
        transform: translate(8px, 0);
        opacity: .55;
      }

      82% {
        transform: translate(-5px, 1px);
      }

      84% {
        transform: translate(3px, -1px);
      }

      86% {
        opacity: 0;
      }
    }

    .message-row {
      margin-top: 45px;
      padding-top: 20px;
      border-top: 1px solid var(--line);

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;

      max-width: 800px;
    }

    .message {
      color: var(--light-grey);
      font-size: 13px;
      line-height: 1.7;
      max-width: 420px;
    }

    .meta {
      color: var(--grey);
      font-size: 10px;
      line-height: 1.8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* random glitch bars */

    .glitch-bar {
      position: fixed;
      background: rgba(255,255,255,.05);
      pointer-events: none;
      z-index: 3;
      opacity: 0;

      animation: barGlitch 8s infinite;
    }

    .bar-one {
      width: 32%;
      height: 3px;
      top: 29%;
      left: 0;
      animation-delay: 1s;
    }

    .bar-two {
      width: 18%;
      height: 7px;
      top: 67%;
      right: 0;
      animation-delay: 3.2s;
    }

    .bar-three {
      width: 55%;
      height: 1px;
      top: 48%;
      left: 24%;
      animation-delay: 5.4s;
    }

    @keyframes barGlitch {
      0%, 94%, 100% {
        opacity: 0;
      }

      95% {
        opacity: .8;
        transform: translateX(0);
      }

      96% {
        transform: translateX(20px);
      }

      97% {
        transform: translateX(-12px);
      }

      98% {
        opacity: 0;
      }
    }

    /* FOOTER */

    footer {
      border-top: 1px solid var(--line);
      padding-top: 18px;

      display: flex;
      justify-content: space-between;

      color: #555;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .page {
        padding: 25px 22px;
      }

      header {
        align-items: flex-start;
      }

      .logo {
        font-size: 11px;
        letter-spacing: 3px;
      }

      .status {
        font-size: 8px;
      }

      .glitch {
        font-size: clamp(52px, 17vw, 90px);
        letter-spacing: -4px;
      }

      .message-row {
        grid-template-columns: 1fr;
        gap: 20px;
        margin-top: 35px;
      }

      footer {
        font-size: 7px;
      }

      footer span:last-child {
        display: none;
      }
    }

  </style>
</head>

<body>

  <div class="glitch-bar bar-one"></div>
  <div class="glitch-bar bar-two"></div>
  <div class="glitch-bar bar-three"></div>

  <div class="page">

    <header>

      <div class="logo">
        RICHNER RECORDS
      </div>

      <div class="status">
        <span class="status-dot"></span>
        Offline
      </div>

    </header>

    <main>

      <div class="code">
        RR / SYSTEM / 2026
      </div>

      <h1
        class="glitch"
        data-text="UNDER MAINTENANCE"
      >
        UNDER<br>
        MAINTENANCE
      </h1>

      <div class="message-row">

        <div class="message">
          Richner Records is currently undergoing
          scheduled maintenance.
          <br><br>
          Please check back soon.
        </div>

        <div class="meta">
          Status / Offline<br>
          System / Updating<br>
          Location / New York<br>
          © 2026 Richner Records LLC
        </div>

      </div>

    </main>

    <footer>

      <span>
        Independent Music / Art / Culture
      </span>

      <span>
        richner-records.com
      </span>

    </footer>

  </div>

</body>
</html>
